syntax = "proto3";
package afs_operation;

// MESSAGES FOR CLIENT OPERATIONS
message InitialiseRequest{
    string code_to_initialise = 1;
}
message InitialiseResponse{
    string input_path = 1;
    string output_path = 2;
}

message FileRequest {
    string filename = 1;
    int32 path_select = 2;
    int64 timestamp = 3;
    string content = 4;
}

message FileResponse {
    bytes content = 1;
    int32 length = 2;
    int64 timestamp = 3;
    int32 update_bit =4;  // update = 1 -> needs to update content on the client otherwise no
}


// DISCOVERY MESSAGES
message StatusRequest {}

message StatusResponse {
    enum ServerRole {
        UNKNOWN = 0;
        PRIMARY = 1;
        BACKUP = 2;
        CANDIDATE = 3;
    }
    ServerRole role = 1;
    int32 term = 2;
}


// MESSAGES FOR INTERNAL REPLICATION & LEADER ELECTION
message HeartbeatRequest {
    string primary_id = 1;
    int32 term = 2;
}

message HeartbeatResponse {
    bool success = 1;
    int32 term = 2; // Backup's current term to check if it higher than primary's
}

message RequestVoteRequest {
    string candidate_id = 1;
    int32 term = 2;
    int64 last_commit_index = 3;
}

message RequestVoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

message ReplicateWriteRequest {
    int32 term = 1;
    string filename = 2;
    bytes content = 3;  // Using bytes to match FileResponse.content type
    int64 timestamp = 4;
    int32 path_select = 5;
    int64 commit_index = 6;
}

message ReplicateWriteResponse {
    bool success = 1;
    int32 term = 2; // Backup's current term
}


// CLIENT-FACING OPERATORS
service operators{
    rpc request_dir (InitialiseRequest) returns (InitialiseResponse);
    rpc open (FileRequest) returns (stream FileResponse);
    rpc close (stream FileRequest) returns (FileResponse);
    rpc compare (FileRequest) returns (stream FileResponse);

    rpc GetStatus (StatusRequest) returns (StatusResponse);
}


// SERVER-FACING INTERNAL REPLICATION
service InternalReplication {
    // Primary calls this on Backups to stay alive
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

    // Primary calls this on Backups to replicate a write
    rpc ReplicateWrite (ReplicateWriteRequest) returns (ReplicateWriteResponse);
   
   // Candidate calls this on other servers to request votes
    rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
}